# vks4 — coturn (STUN + TURN)
# Для dev оставьте localhost. В prod укажите внешний IP + сертификаты.

listening-port=3478
tls-listening-port=5349

# Замените на ваш внешний IP в prod
listening-ip=0.0.0.0
relay-ip=0.0.0.0

min-port=49152
max-port=65535

fingerprint
lt-cred-mech
realm=vks4.local

# Учётка для dev (см. .env, переменные TURN_*).
# В prod используйте динамические учётки через REST API (use-auth-secret).
user=vks:change-me-turn

# Безопасность
no-loopback-peers
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Логирование
log-file=stdout
verbose

# Метрики Prometheus (если включить --prometheus при запуске)
prometheus
