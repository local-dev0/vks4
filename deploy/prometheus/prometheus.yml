global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: control-plane
    static_configs:
      - targets: ["control-plane:9100"]

  - job_name: signaling
    static_configs:
      - targets: ["signaling:9100"]

  - job_name: media-router
    static_configs:
      - targets: ["media-router:9100"]

  - job_name: media-worker
    static_configs:
      - targets: ["media-worker:9100"]

  - job_name: sip-gateway
    static_configs:
      - targets: ["sip-gateway:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
